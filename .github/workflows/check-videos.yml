# Monthly check that the exercise video demos are still public and embeddable. If more than 5%
# fail, this run fails and GitHub emails the repository owner: time to refresh the library.
name: Check exercise videos

on:
  schedule:
    - cron: '0 14 1 * *' # 14:00 UTC on the 1st of each month
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm run check:videos
